name: LocalPass CI

# 首次运行可能需要调试：npm ci 用 --ignore-scripts 跳过 electron-rebuild，
# 若原生依赖（bufferutil 等）缺失，改为 `npm rebuild` 或补 MSVC 后去掉该参数。

on:
  push:
    branches: [main, local-password]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      format:
        description: "只运行 prettier --write 并把结果推到 chore/prettier 分支"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 只有 push 才互相取消；手动触发的运行（例如要跑 macOS 打包、全量测试）不该被挤掉。
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  format:
    name: 仓库格式化
    if: github.event_name == 'workflow_dispatch' && inputs.format
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: prettier --write
        run: npx prettier --write .
      - name: 提交并推送
        run: |
          git config user.name "localpass-bot"
          git config user.email "localpass-bot@users.noreply.github.com"
          git checkout -b chore/prettier
          git add -A
          git commit -m "chore: prettier --write 全仓库格式化" || echo "no changes"
          git push -f origin chore/prettier
  # 阶段 1 护栏：每次提交先过静态检查与单测，失败即阻断后续构建。
  verify-static:
    name: 静态检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 类型检查
        run: npm run test:types
      - name: Lint（eslint + prettier）
        run: npm run lint
      - name: 语言包键集合
        run: npm run test:locales
      - name: 依赖归属
        run: npm run lint:dep-ownership

  # 快速门禁：只跑这次改动涉及的库，几分钟内给出反馈。
  verify-tests:
    name: 单元测试（改动范围）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Jest
        run: >
          npm test -- --ci --coverage=false --maxWorkers=4 --silent
          --testPathPatterns 'libs/(local-vault|importer|key-management-ui|common/src/dirt)/'

  # 全量测试体量太大（本仓库 7000+ 文件），只在手动触发时跑。
  full-tests:
    name: 单元测试（全量）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Jest
        run: npm test -- --ci --coverage=false --maxWorkers=4 --silent
  browser:
    name: Chrome 扩展
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 构建
        run: npm run build:prod:chrome --workspace @localpass/browser
      - name: 打包 zip（加载已解压用）
        run: |
          cd apps/browser/build
          zip -qr ../dist-chrome.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: localpass-chrome
          path: apps/browser/build
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: localpass-chrome-zip
          path: apps/browser/dist-chrome.zip
          retention-days: 14
          if-no-files-found: error

  desktop-windows:
    name: 桌面端 Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/desktop_native
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 构建原生模块
        run: npm run build-native --workspace @localpass/desktop
      - name: 构建应用
        run: npm run build:oss --workspace @localpass/desktop
      - name: 打包（未签名）
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: localpass-windows
          path: |
            apps/desktop/dist/*.exe
          if-no-files-found: error

  desktop-macos:
    name: 桌面端 macOS
    # GitHub 的 macOS runner 可能长时间排队，但 .dmg 是交付物：构建失败必须让流水线变红，
    # 不能再用 continue-on-error 静默放过。
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/desktop_native
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 构建原生模块
        run: npm run build-native --workspace @localpass/desktop
      - name: 构建应用
        run: npm run build:oss --workspace @localpass/desktop
      - name: 打包（未签名）
        working-directory: apps/desktop
        run: npx electron-builder --mac --arm64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: localpass-macos
          path: apps/desktop/dist/*.dmg
          retention-days: 14
          if-no-files-found: error
