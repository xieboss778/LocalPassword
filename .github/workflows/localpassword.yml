name: LocalPassword CI

# 首次运行可能需要调试：npm ci 用 --ignore-scripts 跳过 electron-rebuild，
# 若原生依赖（bufferutil 等）缺失，改为 `npm rebuild` 或补 MSVC 后去掉该参数。

on:
  push:
    branches: [main, local-password]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chrome 扩展
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 构建
        run: npm run build:prod:chrome --workspace @bitwarden/browser
      - uses: actions/upload-artifact@v4
        with:
          name: localpassword-chrome
          path: apps/browser/build
          if-no-files-found: error

  desktop-windows:
    name: 桌面端 Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/desktop_native
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 构建原生模块
        run: npm run build-native --workspace @bitwarden/desktop
      - name: 构建应用
        run: npm run build:oss --workspace @bitwarden/desktop
      - name: 打包（未签名）
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: localpassword-windows
          path: |
            apps/desktop/dist/*.exe
          if-no-files-found: error

  desktop-macos:
    name: 桌面端 macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/desktop_native
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 构建原生模块
        run: npm run build-native --workspace @bitwarden/desktop
      - name: 构建应用
        run: npm run build:oss --workspace @bitwarden/desktop
      - name: 打包（未签名）
        working-directory: apps/desktop
        run: npx electron-builder --mac --arm64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: localpassword-macos
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
