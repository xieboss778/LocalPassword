name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提建议前，请先看一眼 [实施计划](../blob/main/docs/LocalPass-实施计划.md) 和「不在本次范围」一节，避免和既定路线重复或冲突。

        LocalPass 的核心约束是**离线可用**。任何依赖服务器、账号或云端服务的功能，都需要先说明它在断网时的降级行为。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 issue 和 Discussions，没有发现相同建议
          required: true
        - label: 这个功能在完全断网时需要可用（或已说明降级行为）
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到的具体场景是什么？现在为什么做不到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他可接受的做法，或现有工具里类似的设计
    validations:
      required: false
  - type: dropdown
    id: privacy
    attributes:
      label: 是否涉及联网
      options:
        - 完全不需要联网
        - 可选联网，且有离线降级
        - 必须联网
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 相关截图、参考链接、你愿意自己实现吗
    validations:
      required: false
