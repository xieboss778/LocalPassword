name: 安装与构建问题
description: 依赖安装、构建、加载扩展时遇到的问题
title: "[Build] "
labels: [build]
body:
  - type: markdown
    attributes:
      value: |
        构建失败往往和环境有关（Node 版本、Rust 工具链、代理）。请尽量把完整报错贴出来。
  - type: textarea
    id: command
    attributes:
      label: 执行的命令
      placeholder: 例如 npm ci / npm run build:chrome
      render: shell
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 完整报错
      description: 从失败的第一行开始粘贴，**删除任何包含令牌或私有路径的内容**
      render: shell
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node 版本
      description: 运行 `node -v`（应与 .nvmrc 一致）
      placeholder: 例如 v22.14.0
    validations:
      required: true
  - type: input
    id: npm
    attributes:
      label: npm 版本
      placeholder: 例如 10.9.2
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: Rust 工具链
      description: 运行 `rustc -V`；依赖安装会调用 electron-rebuild，需要 Rust
      placeholder: 例如 rustc 1.83.0
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: 操作系统与架构
      placeholder: 例如 macOS 15.1 (arm64)
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 已经尝试过的排查
      description: 例如删掉 node_modules 重装、切换 Node 版本、关闭代理
    validations:
      required: false
