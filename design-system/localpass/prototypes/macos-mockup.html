<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalPass macOS 原型</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        background: #f5f5f7;
        overflow: hidden;
      }

      .window-chrome {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border: 1px solid #d5d5d7;
        border-radius: 10pt;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        position: relative;
      }

      .window-header {
        height: 28pt;
        background: linear-gradient(to bottom, #f9f9fb, #efefef);
        border-bottom: 1px solid #e5e5e7;
        display: flex;
        align-items: center;
        padding: 0 16pt;
        font-size: 11pt;
        user-select: none;
        position: relative;
      }

      .traffic-lights {
        position: absolute;
        left: 12pt;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 8pt;
      }

      .traffic-light {
        width: 12pt;
        height: 12pt;
        border-radius: 50%;
        cursor: pointer;
        transition: all 150ms ease;
      }

      .traffic-light.red {
        background: #ed6158;
      }
      .traffic-light.yellow {
        background: #fcc02e;
      }
      .traffic-light.green {
        background: #5fc038;
      }

      .traffic-light:hover {
        transform: scale(1.2);
      }

      .window-title {
        flex: 1;
        text-align: center;
        font-weight: 600;
        font-size: 12pt;
        color: #333333;
      }

      .content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .sidebar {
        width: 200pt;
        background: #f5f5f7;
        border-right: 1px solid #e5e5e7;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .search-box {
        padding: 10pt 12pt;
        flex-shrink: 0;
      }

      .search-box input {
        width: 100%;
        height: 28pt;
        border: 1px solid #d5d5d7;
        border-radius: 6pt;
        background: white;
        color: #333333;
        padding: 0 8pt;
        font-size: 11pt;
      }

      .search-box input:focus {
        outline: none;
        box-shadow: 0 0 0 1pt #0071e3;
      }

      .sidebar-section {
        flex-shrink: 0;
        padding: 8pt 0;
      }

      .sidebar-label {
        padding: 6pt 16pt;
        font-size: 10pt;
        font-weight: 600;
        color: #666666;
        letter-spacing: 0.3pt;
      }

      .sidebar-item {
        padding: 8pt 16pt;
        cursor: pointer;
        transition: background 150ms ease;
        font-size: 12pt;
        color: #333333;
      }

      .sidebar-item:hover {
        background: rgba(0, 0, 0, 0.05);
      }

      .sidebar-item.active {
        background: rgba(0, 113, 227, 0.15);
        color: #0071e3;
        font-weight: 500;
      }

      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: white;
      }

      .toolbar {
        height: 36pt;
        background: #fafafa;
        border-bottom: 1px solid #e5e5e7;
        display: flex;
        align-items: center;
        gap: 8pt;
        padding: 0 12pt;
        flex-shrink: 0;
      }

      .btn {
        height: 24pt;
        padding: 0 12pt;
        border: 1px solid #d5d5d7;
        border-radius: 6pt;
        background: white;
        color: #333333;
        cursor: pointer;
        font-size: 11pt;
        font-weight: 500;
        transition: all 150ms ease;
      }

      .btn:hover {
        background: #f5f5f7;
        border-color: #c5c5c7;
      }

      .btn.primary {
        background: #0071e3;
        color: white;
        border-color: #0071e3;
      }

      .btn.primary:hover {
        background: #0051b3;
      }

      .list-area {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .item-row {
        padding: 12pt;
        border-bottom: 1px solid #e5e5e7;
        cursor: pointer;
        transition: background 150ms ease;
        display: flex;
        gap: 12pt;
        align-items: center;
      }

      .item-row:hover {
        background: #fafafa;
      }

      .item-row.selected {
        background: rgba(0, 113, 227, 0.08);
      }

      .item-icon {
        width: 32pt;
        height: 32pt;
        border-radius: 8pt;
        background: linear-gradient(135deg, #e8e8ed 0%, #d0d0d7 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16pt;
        flex-shrink: 0;
      }

      .item-info {
        flex: 1;
        min-width: 0;
      }

      .item-title {
        font-size: 12pt;
        font-weight: 500;
        color: #333333;
        margin-bottom: 2pt;
      }

      .item-subtitle {
        font-size: 10pt;
        color: #888888;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .detail-pane {
        width: 240pt;
        background: #fafafa;
        border-left: 1px solid #e5e5e7;
        overflow-y: auto;
        padding: 16pt;
        display: flex;
        flex-direction: column;
      }

      .detail-field {
        margin-bottom: 20pt;
      }

      .detail-label {
        font-size: 9pt;
        font-weight: 600;
        color: #666666;
        margin-bottom: 4pt;
        letter-spacing: 0.3pt;
        text-transform: uppercase;
      }

      .detail-value {
        font-size: 11pt;
        color: #333333;
        word-break: break-all;
        font-family: "SF Mono", monospace;
        padding: 6pt 8pt;
        background: white;
        border: 1px solid #e5e5e7;
        border-radius: 6pt;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .copy-btn {
        width: 20pt;
        height: 20pt;
        border: none;
        background: transparent;
        color: #666666;
        cursor: pointer;
        border-radius: 4pt;
      }

      .copy-btn:hover {
        background: rgba(0, 0, 0, 0.05);
        color: #333333;
      }

      /* Sheet Modal */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0);
        display: none;
        z-index: 1000;
      }

      .modal-overlay.show {
        display: block;
        animation: fadeIn 300ms ease;
      }

      .sheet-modal {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 90%;
        max-width: 600px;
        max-height: 80%;
        background: white;
        border-radius: 12pt 12pt 0 0;
        box-shadow: 0 -1pt 10pt rgba(0, 0, 0, 0.1);
        display: none;
        flex-direction: column;
        animation: slideUp 300ms cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1001;
      }

      .sheet-modal.show {
        display: flex;
      }

      .sheet-handle {
        width: 32pt;
        height: 4pt;
        background: #d5d5d7;
        border-radius: 2pt;
        margin: 8pt auto 12pt;
        flex-shrink: 0;
      }

      .sheet-title {
        padding: 0 16pt 12pt;
        font-size: 14pt;
        font-weight: 600;
        color: #333333;
      }

      .sheet-content {
        flex: 1;
        overflow-y: auto;
        padding: 0 16pt 16pt;
      }

      .sheet-buttons {
        display: flex;
        gap: 8pt;
        padding: 12pt 16pt;
        border-top: 1pt solid #e5e5e7;
        flex-shrink: 0;
      }

      .sheet-buttons button {
        flex: 1;
        height: 32pt;
      }

      /* Context Menu */
      .context-menu {
        position: fixed;
        background: rgba(60, 60, 67, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8pt;
        min-width: 160pt;
        box-shadow: 0 20pt 60pt rgba(0, 0, 0, 0.3);
        z-index: 1000;
        display: none;
        flex-direction: column;
        padding: 4pt 0;
      }

      .context-menu.show {
        display: flex;
      }

      .context-item {
        padding: 6pt 12pt;
        font-size: 11pt;
        color: #e5e5e7;
        cursor: pointer;
        transition: background 150ms ease;
      }

      .context-item:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .context-divider {
        height: 1pt;
        background: rgba(255, 255, 255, 0.1);
        margin: 2pt 0;
      }

      .gesture-hint {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: white;
        border: 1pt solid #e5e5e7;
        border-radius: 8pt;
        padding: 12pt;
        font-size: 11pt;
        color: #333333;
        max-width: 240pt;
        box-shadow: 0 4pt 12pt rgba(0, 0, 0, 0.1);
      }

      .gesture-icon {
        font-size: 20pt;
        margin-bottom: 6pt;
      }

      .gesture-text {
        font-weight: 500;
        margin-bottom: 4pt;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          transform: translateX(-50%) translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateX(-50%) translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 20px;
      "
    >
      <div class="window-chrome" style="width: 800px; height: 600px">
        <div class="window-header">
          <div class="traffic-lights">
            <div class="traffic-light red"></div>
            <div class="traffic-light yellow"></div>
            <div class="traffic-light green"></div>
          </div>
          <div class="window-title">LocalPass</div>
        </div>

        <div class="content">
          <div class="sidebar">
            <div class="search-box">
              <input type="text" placeholder="搜索..." />
            </div>

            <div class="sidebar-section">
              <div class="sidebar-label">Library</div>
              <div class="sidebar-item active">所有条目</div>
              <div class="sidebar-item">登录</div>
              <div class="sidebar-item">密码</div>
              <div class="sidebar-item">笔记</div>
            </div>

            <div class="sidebar-section">
              <div class="sidebar-label">Menu</div>
              <div class="sidebar-item">生成器</div>
              <div class="sidebar-item">设置</div>
            </div>
          </div>

          <div class="main-area">
            <div class="toolbar">
              <button class="btn primary">+ 新建</button>
              <button class="btn">编辑</button>
              <button class="btn">🔒 锁定</button>
            </div>

            <div class="list-area">
              <div class="item-row selected">
                <div class="item-icon">🔑</div>
                <div class="item-info">
                  <div class="item-title">GitHub</div>
                  <div class="item-subtitle">admin@example.com</div>
                </div>
              </div>
              <div class="item-row">
                <div class="item-icon">🌐</div>
                <div class="item-info">
                  <div class="item-title">Gmail</div>
                  <div class="item-subtitle">user@gmail.com</div>
                </div>
              </div>
              <div class="item-row">
                <div class="item-icon">💳</div>
                <div class="item-info">
                  <div class="item-title">AWS Console</div>
                  <div class="item-subtitle">aws-admin@corp.com</div>
                </div>
              </div>
              <div class="item-row">
                <div class="item-icon">🔐</div>
                <div class="item-info">
                  <div class="item-title">Database</div>
                  <div class="item-subtitle">prod_db_user</div>
                </div>
              </div>
            </div>
          </div>

          <div class="detail-pane">
            <h3 style="margin-bottom: 12pt; font-size: 12pt; color: #333">GitHub</h3>

            <div class="detail-field">
              <div class="detail-label">用户名</div>
              <div class="detail-value">
                <span>admin</span>
                <button class="copy-btn" title="复制">📋</button>
              </div>
            </div>

            <div class="detail-field">
              <div class="detail-label">密码</div>
              <div class="detail-value">
                <span>••••••••</span>
                <button class="copy-btn" title="复制">📋</button>
              </div>
            </div>

            <button class="btn" style="width: 100%; margin-top: auto">编辑</button>
          </div>
        </div>
      </div>
    </div>

    <div class="context-menu" id="contextMenu">
      <div class="context-item">复制用户名</div>
      <div class="context-item">复制密码</div>
      <div class="context-divider"></div>
      <div class="context-item">编辑</div>
      <div class="context-item">删除</div>
    </div>

    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="sheet-modal" id="sheetModal">
      <div class="sheet-handle"></div>
      <div class="sheet-title">编辑条目</div>
      <div class="sheet-content">
        <form style="display: flex; flex-direction: column; gap: 12pt">
          <div>
            <label style="font-size: 10pt; color: #666; display: block; margin-bottom: 4pt"
              >标题</label
            >
            <input
              type="text"
              value="GitHub"
              style="
                width: 100%;
                padding: 8pt;
                border: 1pt solid #e5e5e7;
                border-radius: 6pt;
                font-size: 11pt;
              "
            />
          </div>
          <div>
            <label style="font-size: 10pt; color: #666; display: block; margin-bottom: 4pt"
              >用户名</label
            >
            <input
              type="text"
              value="admin"
              style="
                width: 100%;
                padding: 8pt;
                border: 1pt solid #e5e5e7;
                border-radius: 6pt;
                font-size: 11pt;
              "
            />
          </div>
          <div>
            <label style="font-size: 10pt; color: #666; display: block; margin-bottom: 4pt"
              >密码</label
            >
            <input
              type="password"
              value="●●●●●●●●"
              style="
                width: 100%;
                padding: 8pt;
                border: 1pt solid #e5e5e7;
                border-radius: 6pt;
                font-size: 11pt;
              "
            />
          </div>
        </form>
      </div>
      <div class="sheet-buttons">
        <button class="btn" onclick="closeSheet()">取消</button>
        <button class="btn primary" onclick="closeSheet()">保存</button>
      </div>
    </div>

    <div class="gesture-hint">
      <div class="gesture-icon">👆</div>
      <div class="gesture-text">macOS 轨迹板手势</div>
      <div style="font-size: 10pt; color: #888; line-height: 1.6">
        • 双指左滑: 返回<br />
        • 双指右滑: 前进<br />
        • 右键单击: 菜单<br />
        • Cmd+点击: 编辑
      </div>
    </div>

    <script>
      const contextMenu = document.getElementById("contextMenu");
      const itemRows = document.querySelectorAll(".item-row");
      const sheetModal = document.getElementById("sheetModal");
      const modalOverlay = document.getElementById("modalOverlay");

      // 右键菜单
      document.addEventListener("contextmenu", (e) => {
        if (e.target.closest(".item-row")) {
          e.preventDefault();
          contextMenu.style.left = e.pageX + "px";
          contextMenu.style.top = e.pageY + "px";
          contextMenu.classList.add("show");
        }
      });

      document.addEventListener("click", () => {
        contextMenu.classList.remove("show");
      });

      // 条目选择
      itemRows.forEach((row) => {
        row.addEventListener("click", () => {
          itemRows.forEach((r) => r.classList.remove("selected"));
          row.classList.add("selected");
        });

        // 双击编辑 (macOS 习惯)
        row.addEventListener("dblclick", () => {
          openSheet();
        });
      });

      // 编辑按钮
      document.querySelector(".btn:nth-of-type(2)").addEventListener("click", () => {
        openSheet();
      });

      function openSheet() {
        modalOverlay.classList.add("show");
        sheetModal.classList.add("show");
      }

      function closeSheet() {
        modalOverlay.classList.remove("show");
        sheetModal.classList.remove("show");
      }

      // 点击遮罩关闭
      modalOverlay.addEventListener("click", closeSheet);
    </script>
  </body>
</html>
