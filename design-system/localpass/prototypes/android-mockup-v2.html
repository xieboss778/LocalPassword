<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalPass Android 原型 v2 - 重新设计</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
        background: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      :root {
        --bg-primary: #0f1419;
        --bg-secondary: #1a1f2e;
        --bg-tertiary: #272e3f;
        --bg-glass: rgba(255, 255, 255, 0.1);
        --text-primary: #f5f7fa;
        --text-secondary: #a0aec0;
        --text-tertiary: #7a8fa3;
        --accent: #10b981;
        --accent-hover: #059669;
        --accent-active: #047857;
        --border-color: #334155;
        --focus-color: #3b82f6;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInDown {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .device-frame {
        width: 360px;
        height: 720px;
        background: var(--bg-primary);
        border-radius: 40px;
        border: 12px solid #000;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      /* 状态栏 */
      .status-bar {
        height: 24px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        font-size: 10px;
        color: var(--text-tertiary);
        flex-shrink: 0;
      }

      .status-left,
      .status-right {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      /* 应用容器 */
      .app-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg-primary);
        overflow: hidden;
        animation: slideInUp 400ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* TopAppBar */
      .top-app-bar {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 4px 0 16px;
        background: linear-gradient(to bottom, var(--bg-secondary), var(--bg-primary));
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 10;
        flex-shrink: 0;
      }

      .app-title {
        flex: 1;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        border-radius: 20px;
        transition: all 150ms cubic-bezier(0.16, 1, 0.3, 1);
        font-size: 18px;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
      }

      .icon-btn:active {
        background: rgba(255, 255, 255, 0.15);
        transform: scale(0.95);
      }

      /* 搜索框 */
      .search-container {
        padding: 12px 16px;
        flex-shrink: 0;
      }

      .search-field {
        width: 100%;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 0 12px;
        transition: all 150ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .search-field:hover {
        border-color: rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.11);
      }

      .search-field:focus-within {
        border-color: var(--focus-color);
        background: rgba(255, 255, 255, 0.14);
      }

      .search-input {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text-primary);
        font-size: 14px;
        outline: none;
      }

      .search-input::placeholder {
        color: var(--text-tertiary);
      }

      /* 内容区域 */
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }

      .section-title {
        font-size: 12px;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
        margin: 12px 0 8px 0;
        padding: 0 4px;
      }

      /* 条目卡片 */
      .entry-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 8px;
        display: flex;
        gap: 12px;
        align-items: center;
        cursor: pointer;
        transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
        animation: slideInUp 300ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }

      .entry-card:nth-child(1) {
        animation-delay: 0ms;
      }
      .entry-card:nth-child(2) {
        animation-delay: 50ms;
      }
      .entry-card:nth-child(3) {
        animation-delay: 100ms;
      }
      .entry-card:nth-child(4) {
        animation-delay: 150ms;
      }

      .entry-card:hover {
        background: var(--bg-tertiary);
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
      }

      .entry-card:active {
        transform: translateY(0px);
      }

      .card-icon {
        width: 40px;
        height: 40px;
        background: rgba(16, 185, 129, 0.15);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-size: 18px;
        flex-shrink: 0;
      }

      .card-info {
        flex: 1;
        min-width: 0;
      }

      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 2px;
      }

      .card-subtitle {
        font-size: 12px;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* BottomSheet */
      .bottom-sheet-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        display: none;
        z-index: 999;
        animation: fadeIn 300ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .bottom-sheet {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--bg-secondary);
        border-radius: 20px 20px 0 0;
        border-top: 1px solid var(--border-color);
        max-height: 70vh;
        overflow-y: auto;
        display: none;
        z-index: 1000;
        animation: slideInUp 300ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .sheet-handle {
        width: 40px;
        height: 4px;
        background: var(--border-color);
        border-radius: 2px;
        margin: 12px auto;
      }

      .sheet-content {
        padding: 0 16px 20px;
      }

      /* FAB */
      .fab {
        position: fixed;
        bottom: 24px;
        right: 16px;
        width: 56px;
        height: 56px;
        background: var(--accent);
        border: none;
        border-radius: 28px;
        color: white;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 24px rgba(16, 185, 129, 0.35);
        transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 50;
      }

      .fab:hover {
        background: var(--accent-hover);
        box-shadow: 0 8px 32px rgba(16, 185, 129, 0.4);
        transform: scale(1.08);
      }

      .fab:active {
        background: var(--accent-active);
        transform: scale(0.95);
      }

      /* Snackbar */
      .snackbar {
        position: fixed;
        bottom: 90px;
        left: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 12px;
        display: none;
        z-index: 999;
        animation: slideInUp 300ms cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .snackbar.show {
        display: block;
      }

      /* 滚动条 */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* 焦点管理 */
      *:focus-visible {
        outline: 2px solid var(--focus-color);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="device-frame">
      <!-- 状态栏 -->
      <div class="status-bar">
        <div class="status-left">
          <span>9:41</span>
        </div>
        <div class="status-right">
          <span>📶</span>
          <span>🔋</span>
        </div>
      </div>

      <!-- 应用容器 -->
      <div class="app-container">
        <!-- TopAppBar -->
        <div class="top-app-bar">
          <span class="app-title">LocalPass</span>
          <button class="icon-btn" title="搜索" aria-label="打开搜索">🔍</button>
          <button class="icon-btn" title="更多选项" aria-label="打开菜单">⋮</button>
        </div>

        <!-- 搜索框 -->
        <div class="search-container">
          <div class="search-field">
            <span>🔍</span>
            <input
              type="text"
              class="search-input"
              placeholder="搜索条目..."
              aria-label="搜索保险库"
            />
          </div>
        </div>

        <!-- 内容 -->
        <div class="content">
          <div class="section-title">我的凭证</div>

          <div class="entry-card" role="button" tabindex="0" aria-label="Gmail 账户">
            <div class="card-icon">🔐</div>
            <div class="card-info">
              <div class="card-title">Gmail</div>
              <div class="card-subtitle">user@gmail.com</div>
            </div>
          </div>

          <div class="entry-card" role="button" tabindex="0" aria-label="GitHub 账户">
            <div class="card-icon">🔐</div>
            <div class="card-info">
              <div class="card-title">GitHub</div>
              <div class="card-subtitle">developer</div>
            </div>
          </div>

          <div class="entry-card" role="button" tabindex="0" aria-label="AWS 凭证">
            <div class="card-icon">🌐</div>
            <div class="card-info">
              <div class="card-title">AWS Console</div>
              <div class="card-subtitle">admin@company.com</div>
            </div>
          </div>

          <div class="entry-card" role="button" tabindex="0" aria-label="支付卡">
            <div class="card-icon">💳</div>
            <div class="card-info">
              <div class="card-title">MasterCard</div>
              <div class="card-subtitle">****1234 • 有效期至 12/26</div>
            </div>
          </div>
        </div>
      </div>

      <!-- FAB -->
      <button class="fab" title="添加新条目" aria-label="添加新条目">➕</button>
    </div>

    <!-- Snackbar -->
    <div class="snackbar" id="snackbar" role="status" aria-live="polite">已复制到剪贴板</div>

    <script>
      // 条目卡片交互
      document.querySelectorAll(".entry-card").forEach((card) => {
        card.addEventListener("click", () => {
          // Show snackbar
          const snackbar = document.getElementById("snackbar");
          snackbar.classList.add("show");
          setTimeout(() => snackbar.classList.remove("show"), 2000);
        });

        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            card.click();
          }
        });
      });

      // FAB 交互
      document.querySelector(".fab").addEventListener("click", () => {
        alert("打开新建条目对话框");
      });

      // Icon 按钮交互
      document.querySelectorAll(".icon-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          // Handle actions
        });
      });
    </script>
  </body>
</html>
