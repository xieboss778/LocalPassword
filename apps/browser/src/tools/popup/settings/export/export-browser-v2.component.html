<div class="agy tw-flex tw-h-full tw-flex-col tw-bg-background">
  <lp-popup-header
    [title]="i18n.t('exportLabel')"
    [sub]="i18n.t('exportSubtitle')"
    [back]="true"
    (backTriggered)="back()"
  ></lp-popup-header>

  <div class="agy-ext-scroll">
    <div class="agy-callout agy-warn">
      <bit-icon name="bwi-exclamation-triangle" class="tw-text-xs"></bit-icon>
      <div>{{ warning() }}</div>
    </div>

    <div class="agy-grp tw-mt-2">
      <lp-field
        layout="row"
        id="export_select_format"
        [label]="i18n.t('exportFormatLabel')"
        [options]="formatOptions"
        [(value)]="formatValue"
      ></lp-field>
      <lp-field
        layout="row"
        id="export_input_vault_password"
        [label]="i18n.t('masterPass')"
        [password]="true"
        [autocomplete]="'current-password'"
        [(value)]="vaultPassword"
      ></lp-field>
      @if (encrypted()) {
        <lp-field
          layout="row"
          id="export_input_password"
          [label]="i18n.t('filePassword')"
          [placeholder]="i18n.t('exportPasswordPlaceholder')"
          [hint]="i18n.t('exportPasswordHint')"
          [password]="true"
          [autocomplete]="'new-password'"
          [(value)]="filePassword"
        ></lp-field>
      }
    </div>

    <button
      id="export-button_submit"
      type="button"
      class="agy-btn agy-primary agy-lg agy-block tw-mt-2"
      [disabled]="busy()"
      (click)="exportNow()"
    >
      {{ i18n.t("exportVerb") }}
    </button>

    @if (error()) {
      <p class="agy-hint agy-hint-error">{{ error() }}</p>
    }

    <div class="tw-grid tw-grid-cols-2 tw-gap-1.5 tw-pt-2">
      <div class="agy-stat">
        <div class="agy-n">{{ itemCount() }}</div>
        <div class="agy-l">{{ i18n.t("exportStatsItems") }}</div>
      </div>
      <div class="agy-stat">
        <div class="agy-n">{{ folderCount() }}</div>
        <div class="agy-l">{{ i18n.t("exportStatsFolders") }}</div>
      </div>
    </div>
  </div>
</div>
