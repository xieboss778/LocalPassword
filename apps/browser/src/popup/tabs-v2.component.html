<div class="agy tw-flex tw-h-full tw-flex-col tw-bg-background">
  <div class="tw-min-h-0 tw-flex-1">
    <router-outlet></router-outlet>
  </div>

  <nav class="agy-ext-nav" [attr.aria-label]="i18n.t('primaryNavigation')">
    <a
      routerLink="/tabs/vault"
      routerLinkActive="agy-on"
      #vaultLink="routerLinkActive"
      [attr.aria-current]="vaultLink.isActive ? 'page' : null"
    >
      <bit-icon name="bwi-vault" class="tw-text-base"></bit-icon>
      <span>{{ i18n.t("vault") }}</span>
    </a>

    <a
      routerLink="/tabs/generator"
      routerLinkActive="agy-on"
      #generatorLink="routerLinkActive"
      [attr.aria-current]="generatorLink.isActive ? 'page' : null"
    >
      <bit-icon name="bwi-generate" class="tw-text-base"></bit-icon>
      <span>{{ i18n.t("generator") }}</span>
    </a>

    <a
      routerLink="/tabs/sync"
      routerLinkActive="agy-on"
      #syncLink="routerLinkActive"
      [attr.aria-current]="syncLink.isActive ? 'page' : null"
    >
      <bit-icon name="bwi-refresh" class="tw-text-base"></bit-icon>
      <span>{{ i18n.t("sync") }}</span>
    </a>

    <a
      routerLink="/tabs/settings"
      routerLinkActive="agy-on"
      #settingsLink="routerLinkActive"
      [attr.aria-current]="settingsLink.isActive ? 'page' : null"
    >
      <bit-icon name="bwi-settings" class="tw-text-base"></bit-icon>
      <span>{{ i18n.t("settings") }}</span>
    </a>
  </nav>
</div>
