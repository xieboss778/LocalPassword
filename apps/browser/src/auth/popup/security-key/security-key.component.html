<div class="tw-flex tw-h-full tw-flex-col tw-bg-background">
  @if (compact()) {
    <lp-popup-header
      [title]="'securityKey' | i18n"
      [sub]="'securityKeyDescription' | i18n"
      [back]="true"
      (backTriggered)="goBack()"
    ></lp-popup-header>
  } @else {
    <lp-page-header
      [title]="'securityKey' | i18n"
      [sub]="'securityKeyDescription' | i18n"
    ></lp-page-header>
  }

  <div class="tw-min-h-0 tw-flex-1 tw-overflow-auto tw-pb-8">
    @if (!supported()) {
      <div
        class="tw-mx-3 tw-rounded-xl tw-border tw-border-border-danger-soft tw-bg-bg-danger-soft tw-px-3 tw-py-2.5 tw-text-xs tw-text-fg-danger-strong"
      >
        {{ "securityKeyUnsupported" | i18n }}
      </div>
    } @else {
      <lp-group [label]="'securityKey' | i18n">
        <lp-row
          icon="bwi-key"
          [label]="'securityKeyRegistered' | i18n"
          [value]="registeredCount().toString()"
          [clickable]="false"
        />
      </lp-group>

      <div class="tw-flex tw-flex-col tw-gap-2 tw-px-3 tw-pt-3">
        <button type="button" bitButton buttonType="primary" [disabled]="busy()" (click)="enroll()">
          {{ "securityKeyEnroll" | i18n }}
        </button>
        @if (registeredCount() > 0) {
          <button
            type="button"
            bitButton
            buttonType="danger"
            [disabled]="busy()"
            (click)="removeAll()"
          >
            {{ "securityKeyRemove" | i18n }}
          </button>
        }
      </div>
    }
  </div>
</div>
