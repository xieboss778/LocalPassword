<form [formGroup]="formGroup" [bitSubmit]="submit">
  @if (waiting()) {
    <div class="agy-callout agy-warn" role="status" aria-live="polite">
      <bit-icon
        name="bwi-exclamation-triangle"
        class="tw-flex-none tw-text-xs"
        aria-hidden="true"
      ></bit-icon>
      <div>
        <div class="agy-k">{{ "unlockWaitTitle" | i18n }}</div>
        <div>{{ "unlockWaitText" | i18n }}</div>
        <div class="agy-waitclock" aria-hidden="true">{{ waitingClock() }}</div>
        <span class="tw-sr-only">{{
          "unlockWaitRemaining" | i18n: waitingSeconds().toString()
        }}</span>
      </div>
    </div>
  }

  <input
    id="masterPassword"
    type="password"
    formControlName="masterPassword"
    class="agy-unlock-input"
    appAutofocus
    name="masterPassword"
    data-testid="lock-master-password-input"
    required
    appInputVerbatim
    [placeholder]="(waiting() ? 'unlockWaitPlaceholder' : 'masterPassPlaceholder') | i18n"
    [attr.aria-label]="'masterPass' | i18n"
  />

  <button
    type="submit"
    class="agy-btn agy-primary agy-lg agy-block tw-mt-2"
    [disabled]="waiting()"
    data-testid="lock-master-password-unlock-button"
  >
    {{ "unlock" | i18n }}
  </button>

  @if (showBiometricsSwap()) {
    <button
      type="button"
      class="agy-btn agy-lg agy-block tw-mt-1"
      [disabled]="!biometricsAvailable()"
      (click)="swapToBiometrics.emit()"
      data-testid="lock-biometric-swap-button"
    >
      <span> {{ biometricUnlockBtnText() | i18n }}</span>
    </button>
  }

  @if (showPinSwap()) {
    <button
      type="button"
      class="agy-btn agy-lg agy-block tw-mt-1"
      (click)="swapToPin.emit()"
      data-testid="lock-pin-swap-button"
    >
      {{ "unlockWithPin" | i18n }}
    </button>
  }

  <div class="agy-foot tw-flex tw-w-full tw-flex-col tw-pt-2">
    <bit-unlock-via-prf
      [link]="true"
      [linkIcon]="true"
      (unlockSuccess)="onPrfUnlockSuccess($event)"
    ></bit-unlock-via-prf>
    @if (showRestore()) {
      <button
        type="button"
        class="tw-text-xs tw-font-medium tw-text-fg-brand"
        data-testid="lock-restore-link"
        (click)="restore.emit()"
      >
        {{ "forgotPasswordRestore" | i18n }}
      </button>
    }
    @if (showLogOut()) {
      <button
        type="button"
        class="tw-text-xs tw-font-medium tw-text-muted"
        data-testid="lock-master-password-logout-button"
        (click)="logOut.emit()"
      >
        {{ "logOut" | i18n }}
      </button>
    }
  </div>
</form>
