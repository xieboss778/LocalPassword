<span
  class="tw-absolute tw-top-[50%] tw-left-[50%] tw-translate-x-[-50%] tw-translate-y-[-50%] tw-leading-[0px]"
>
  @if (showLoadingStyle()) {
    <bit-spinner [size]="spinnerSize()" />
  } @else {
    @if (iconName(); as name) {
      <bit-icon [name]="name" class="!tw-m-0" />
    }
  }
</span>
