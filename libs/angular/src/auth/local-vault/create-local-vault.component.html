<div class="tw-flex tw-h-full tw-flex-col tw-bg-background">
  <lp-page-header
    [title]="'createLocalVaultTitle' | i18n"
    [sub]="'createLocalVaultSubtitle' | i18n"
  ></lp-page-header>

  <div class="tw-min-h-0 tw-flex-1 tw-overflow-auto tw-pb-8">
    <lp-group [label]="'vaultIdentity' | i18n">
      <lp-field
        [label]="'emailAddress' | i18n"
        [value]="email.value ?? ''"
        (valueChange)="setField('email', $event)"
      />
      <lp-field
        [label]="'name' | i18n"
        [value]="name.value ?? ''"
        (valueChange)="setField('name', $event)"
      />
    </lp-group>

    <lp-group [label]="'masterPassword' | i18n">
      <lp-field
        [label]="'masterPassword' | i18n"
        [password]="true"
        [autocomplete]="'new-password'"
        [value]="masterPassword.value ?? ''"
        (valueChange)="setField('masterPassword', $event)"
      />
      <lp-field
        [label]="'confirmMasterPassword' | i18n"
        [password]="true"
        [autocomplete]="'new-password'"
        [value]="confirmMasterPassword.value ?? ''"
        (valueChange)="setField('confirmMasterPassword', $event)"
      />
    </lp-group>

    @if (errorMessage() != null) {
      <p class="tw-px-4 tw-pt-3 tw-text-xs tw-text-fg-danger">{{ errorMessage() }}</p>
    }

    <div class="tw-px-3 tw-pt-3">
      <button
        type="button"
        bitButton
        buttonType="primary"
        [block]="true"
        [disabled]="submitting()"
        (click)="submit()"
      >
        {{ "createLocalVault" | i18n }}
      </button>
    </div>

    <div class="tw-px-3 tw-pt-2 tw-text-center">
      <button type="button" bitLink linkType="secondary" (click)="restoreFromBackup()">
        {{ "restoreFromBackup" | i18n }}
      </button>
    </div>

    <p class="tw-px-4 tw-pt-3 tw-text-xs tw-leading-relaxed tw-text-muted">
      {{ "createLocalVaultNote" | i18n }}
    </p>
  </div>
</div>
