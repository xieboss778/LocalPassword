<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocalPassword — 界面重构原型</title>
    <!--
      原型：三种结构性不同的界面方向，同一份假数据，?variant=A|B|C 切换。
      这不是产品代码：没有测试、没有错误处理、不碰真实存储。拍板后按选中的方向重写进 Angular。
    -->
    <style>
      :root {
        --ink: #14161a;
        --ink-2: #4a4f57;
        --ink-3: #868d98;
        --line: #e3e6ea;
        --surface: #ffffff;
        --surface-2: #f5f6f8;
        --brand: #2b6ef5;
        --brand-ink: #ffffff;
        --danger: #d2483c;
        --radius: 14px;
        --shadow: 0 1px 2px rgba(16, 18, 22, 0.06), 0 8px 24px rgba(16, 18, 22, 0.08);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 32px 16px 96px;
        background: radial-gradient(1200px 600px at 50% -10%, #eef1f6, #dfe3ea 60%, #d6dae1);
        color: var(--ink);
      }
      .stage { display: flex; flex-direction: column; gap: 10px; }
      .stage-note { font-size: 11px; color: var(--ink-3); text-align: center; letter-spacing: 0.04em; }

      /* popup frame: 380x620 like the extension popup */
      .popup {
        width: 380px;
        height: 620px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow), 0 0 0 1px rgba(16, 18, 22, 0.06);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .screens { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
      .screen[data-active="true"] { display: flex; }

      /* top screen tabs (review aid, not part of the design) */
      .screen-tabs {
        display: flex; gap: 4px; padding: 6px; background: #11151c0d; border-bottom: 1px solid var(--line);
      }
      .screen-tabs button {
        flex: 1; font: inherit; font-size: 11px; padding: 6px 0; border: 0; border-radius: 8px;
        background: transparent; color: var(--ink-2); cursor: pointer;
      }
      .screen-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px #0000001a; }

      /* switcher (review aid) */
      .switcher {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px;
        background: #11151c; color: #f5f7fa; border-radius: 999px; padding: 8px 12px;
        box-shadow: 0 10px 30px #00000033; font-size: 12px; z-index: 50;
      }
      .switcher button {
        border: 0; background: #ffffff1f; color: inherit; width: 26px; height: 26px;
        border-radius: 999px; cursor: pointer; font-size: 13px; line-height: 1;
      }
      .switcher .label { min-width: 150px; text-align: center; letter-spacing: 0.02em; }
      .switcher .hint { color: #ffffff80; font-size: 11px; }

      /* ===== shared atoms ===== */
      .icon { width: 18px; height: 18px; display: block; }
      .muted { color: var(--ink-3); }
      .tiny { font-size: 11px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      button { font: inherit; }
      .avatar {
        width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
        background: #eef2ff; color: #3757c8; font-weight: 600; font-size: 13px;
      }

      /* ===== Variant A: focus card ===== */
      .va { padding: 18px 18px 0; gap: 14px; }
      .va-head { display: flex; align-items: center; justify-content: space-between; }
      .va-title { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
      .va-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
      .va-search {
        display: flex; align-items: center; gap: 8px; padding: 10px 12px;
        background: var(--surface-2); border-radius: 12px; color: var(--ink-3); font-size: 13px;
      }
      .va-list { display: flex; flex-direction: column; gap: 10px; overflow: auto; padding-bottom: 90px; }
      .va-card {
        display: flex; align-items: center; gap: 12px; padding: 13px 14px;
        border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
      }
      .va-card .badge { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #f0f3f8; font-size: 16px; }
      .va-card .body { flex: 1; min-width: 0; }
      .va-card .name { font-size: 13.5px; font-weight: 600; }
      .va-card .user { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .va-fab {
        position: absolute; right: 18px; bottom: 18px; width: 52px; height: 52px; border-radius: 999px;
        background: var(--brand); color: var(--brand-ink); border: 0; display: grid; place-items: center;
        box-shadow: 0 10px 22px #2b6ef540; font-size: 24px; cursor: pointer;
      }
      .va-unlock { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 28px; }
      .va-lock { width: 64px; height: 64px; border-radius: 20px; background: #eef2ff; display: grid; place-items: center; margin: 0 auto; }
      .va-field { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--ink-2); background: var(--surface); }
      .va-primary { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 12px; padding: 13px; font-weight: 600; cursor: pointer; }
      .va-ghost { background: transparent; border: 0; color: var(--ink-2); font-size: 12px; cursor: pointer; }

      /* ===== Variant B: command palette ===== */
      .vb { padding: 0; }
      .vb-bar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .vb-prompt { color: var(--brand); font-weight: 700; }
      .vb-input { flex: 1; border: 0; outline: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--ink); }
      .vb-tag { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #eef2ff; color: #3757c8; }
      .vb-list { flex: 1; overflow: auto; padding-bottom: 96px; }
      .vb-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid #f0f2f5; }
      .vb-row[data-selected="true"] { background: #f2f6ff; box-shadow: inset 3px 0 0 var(--brand); }
      .vb-row .name { font-size: 12.5px; font-weight: 550; }
      .vb-row .meta { font-size: 10.5px; color: var(--ink-3); }
      .vb-score { font-size: 10px; color: var(--ink-3); }
      .vb-status { display: flex; justify-content: space-between; padding: 7px 14px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: 10.5px; color: var(--ink-3); }
      .vb-unlock { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 22px 14px; }
      .vb-hint { font-size: 10.5px; color: var(--ink-3); }
      .vb-cmd { display: flex; justify-content: space-between; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; }

      /* ===== Variant C: grouped native ===== */
      .vc { padding: 0; background: #f2f3f6; }
      .vc-top {
        padding: 14px 16px 10px; background: #f2f3f6ee; backdrop-filter: blur(8px);
        border-bottom: 1px solid #0000000d;
      }
      .vc-top h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      .vc-search { background: #ffffffb3; border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--ink-3); }
      .vc-scroll { flex: 1; overflow: auto; padding-bottom: 92px; }
      .vc-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); padding: 14px 16px 6px; }
      .vc-group { background: var(--surface); border-radius: 12px; margin: 0 12px; overflow: hidden; }
      .vc-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #0000000a; }
      .vc-row:last-child { border-bottom: 0; }
      .vc-row .k { flex: 1; font-size: 13px; }
      .vc-row .v { font-size: 12px; color: var(--ink-3); }
      .vc-switch { width: 40px; height: 24px; border-radius: 999px; background: #34c759; position: relative; flex: none; }
      .vc-switch::after { content: ""; position: absolute; inset: 2px auto 2px 18px; width: 20px; border-radius: 999px; background: #fff; }
      .vc-dot { width: 8px; height: 8px; border-radius: 999px; background: #34c759; }
      .vc-tabbar {
        display: flex; border-top: 1px solid #0000000d; background: #ffffff; padding: 6px 0 8px;
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
      }
      .vc-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--ink-3); }
      .vc-tab[data-active="true"] { color: var(--brand); }
      .vc-unlock { flex: 1; display: flex; flex-direction: column; }
      .vc-hero { padding: 34px 24px 18px; text-align: center; }
      .vc-hero .ring { width: 74px; height: 74px; border-radius: 999px; background: #fff; display: grid; place-items: center; margin: 0 auto 12px; box-shadow: 0 4px 14px #00000012; }
      .vc-hero h2 { margin: 0; font-size: 17px; }
      .vc-hero p { margin: 4px 0 0; font-size: 11.5px; color: var(--ink-3); }

      .legend { max-width: 260px; font-size: 11.5px; line-height: 1.6; color: #3d434c; }
      .legend h3 { font-size: 12px; margin: 0 0 6px; }
      .legend ul { margin: 0; padding-left: 16px; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="popup" id="popup">
        <div class="screen-tabs" id="screenTabs">
          <button data-screen="unlock" aria-selected="true">解锁</button>
          <button data-screen="vault">保险库</button>
          <button data-screen="detail">条目详情</button>
          <button data-screen="settings">设置 / 备份</button>
        </div>
        <div class="screens" id="screens"></div>
      </div>
      <p class="stage-note">扩展弹窗实际尺寸 380 × 620</p>
    </div>

    <div class="legend">
      <h3>怎么看</h3>
      <ul>
        <li>底部黑色药丸：切换 A / B / C 三个方向（← → 键也行）</li>
        <li>顶部灰条：切换四个界面，不是设计的一部分</li>
        <li>同一份假数据，三种结构：卡片流 / 命令面板 / 分组原生</li>
      </ul>
    </div>

    <div class="switcher" id="switcher">
      <button id="prev" aria-label="上一个方向">←</button>
      <span class="label" id="label"></span>
      <button id="next" aria-label="下一个方向">→</button>
    </div>

    <script>
      const data = {
        user: "xié",
        items: [
          { icon: "🔐", name: "GitHub", user: "bossxie", otp: true, tag: "开发" },
          { icon: "✉️", name: "Proton Mail", user: "bossxie@proton.me", otp: false, tag: "邮箱" },
          { icon: "🏦", name: "招商银行", user: "6214 **** 8891", otp: false, tag: "金融" },
          { icon: "☁️", name: "Cloudflare", user: "ops@xie.dev", otp: true, tag: "基础设施" },
          { icon: "🎮", name: "Steam", user: "bossxie", otp: true, tag: "娱乐" },
        ],
        settings: [
          { k: "安全密码", v: "已设置 · 上次修改 3 天前" },
          { k: "Touch ID 解锁", toggle: true },
          { k: "云备份（R2）", v: "r2://localpassword · 仅手动" },
          { k: "上次同步", v: "今天 14:02" },
          { k: "备份口令", v: "••••••••••••" },
        ],
      };

      const VARIANTS = [
        { key: "A", name: "卡片流" },
        { key: "B", name: "命令面板" },
        { key: "C", name: "分组原生" },
      ];

      let state = { variant: "A", screen: "unlock" };

      const icon = (path, size = 18) =>
        '<svg class="icon" viewBox="0 0 24 24" width="' + size + '" height="' + size +
        '" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
        path + "</svg>";
      const ICONS = {
        lock: icon('<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>', 26),
        search: icon('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>'),
        chevron: icon('<path d="M9 6l6 6-6 6"/>', 16),
        back: icon('<path d="M15 6l-6 6 6 6"/>', 16),
        plus: icon('<path d="M12 5v14M5 12h14"/>', 22),
        finger: icon('<path d="M12 4a8 8 0 0 0-8 8v2"/><path d="M20 14v-2a8 8 0 0 0-4-6.9"/><path d="M8 20v-6a4 4 0 0 1 8 0v4"/>'),
        shield: icon('<path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/>', 26),
        vault: icon('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>'),
        gear: icon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 3.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H2a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 6 3.2l.1.1a1.7 1.7 0 0 0 1.9.3H8a1.7 1.7 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 20.8 6l-.1.1a1.7 1.7 0 0 0-.3 1.9V8a1.7 1.7 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
        cloud: icon('<path d="M17 18a4 4 0 0 0 .6-7.96A6 6 0 0 0 6 9.5 3.5 3.5 0 0 0 6.5 18z"/>'),
      };

      /* ---------- Variant A ---------- */
      function renderA() {
        const unlock = '<div class="screen va" data-active="' + (state.screen === "unlock") + '">' +
          '<div class="va-unlock">' +
            '<div class="va-lock">' + ICONS.lock + "</div>" +
            '<div style="text-align:center"><div style="font-size:17px;font-weight:650">打开保险库</div>' +
            '<div class="tiny muted" style="margin-top:4px">全部数据只在这台电脑上</div></div>' +
            '<div class="va-field">安全密码</div>' +
            '<button class="va-primary">解锁</button>' +
            '<button class="va-ghost">' + ICONS.finger + "</button>" +
          "</div></div>";

        const vault = '<div class="screen va" data-active="' + (state.screen === "vault") + '">' +
          '<div class="va-head"><div><div class="va-title">保险库</div>' +
          '<div class="va-sub">5 个条目 · 本地 · 已加密</div></div>' +
          '<div class="avatar">' + data.user + "</div></div>" +
          '<div class="va-search">' + ICONS.search + "<span>搜索条目…</span></div>" +
          '<div class="va-list">' +
            data.items.map((it) =>
              '<div class="va-card"><div class="badge">' + it.icon + "</div>" +
              '<div class="body"><div class="name">' + it.name + "</div>" +
              '<div class="user">' + it.user + "</div></div>" +
              (it.otp ? '<span class="tiny mono" style="color:#3757c8">742 913</span>' : "") +
              '<span class="muted">' + ICONS.chevron + "</span></div>").join("") +
          "</div>" +
          '<button class="va-fab">' + ICONS.plus + "</button></div>";

        const detail = '<div class="screen va" data-active="' + (state.screen === "detail") + '">' +
          '<div class="va-head" style="padding-top:6px">' +
          '<span class="muted">' + ICONS.back + "</span>" +
          '<div class="tiny muted">登录 · 开发</div><span></span></div>' +
          '<div style="display:flex;gap:12px;align-items:center;padding:6px 0 2px">' +
          '<div class="va-card" style="border:0;padding:0;gap:12px"><div class="badge" style="width:48px;height:48px;font-size:20px">🔐</div></div>' +
          '<div><div style="font-size:17px;font-weight:650">GitHub</div><div class="tiny muted">github.com</div></div></div>' +
          '<div class="va-field"><div class="tiny muted">用户名</div><div>bossxie</div></div>' +
          '<div class="va-field"><div class="tiny muted">密码</div><div class="mono">••••••••••••</div></div>' +
          '<div class="va-field"><div class="tiny muted">动态口令</div>' +
          '<div class="mono" style="color:#3757c8;font-size:16px">742 913</div></div>' +
          '<button class="va-primary" style="margin-top:auto">复制密码</button></div>';

        const settings = '<div class="screen va" data-active="' + (state.screen === "settings") + '">' +
          '<div class="va-head"><div><div class="va-title">设置</div>' +
          '<div class="va-sub">离线优先 · 无账号</div></div></div>' +
          '<div class="va-list">' +
            data.settings.map((s) =>
              '<div class="va-card"><div class="body"><div class="name">' + s.k + "</div>" +
              (s.v ? '<div class="user">' + s.v + "</div>" : "") + "</div>" +
              (s.toggle ? '<div class="vc-switch"></div>' : '<span class="muted">' + ICONS.chevron + "</span>") +
              "</div>").join("") +
          "</div></div>";

        return unlock + vault + detail + settings;
      }

      /* ---------- Variant B ---------- */
      function renderB() {
        const unlock = '<div class="screen vb" data-active="' + (state.screen === "unlock") + '">' +
          '<div class="vb-bar"><span class="vb-prompt">&gt;</span>' +
          '<input class="vb-input" placeholder="输入安全密码" value="" readonly />' +
          '<span class="vb-tag">本地</span></div>' +
          '<div class="vb-unlock">' +
          '<div class="vb-hint">没有账号，没有注册。这一个密码只存在这台电脑上。</div>' +
          '<div class="vb-cmd"><span>回车 解锁</span><span class="mono muted">↵</span></div>' +
          '<div class="vb-cmd"><span>用 Touch ID 解锁</span><span class="mono muted">⌘⇧T</span></div>' +
          '<div class="vb-cmd"><span>从备份恢复…</span><span class="mono muted">⌘R</span></div>' +
          "</div>" +
          '<div class="vb-status"><span>5 个条目</span><span>AES-256-GCM · 本地</span></div></div>';

        const vault = '<div class="screen vb" data-active="' + (state.screen === "vault") + '">' +
          '<div class="vb-bar"><span class="vb-prompt">&gt;</span>' +
          '<input class="vb-input" value="gi" readonly /><span class="vb-tag">5/5</span></div>' +
          '<div class="vb-list">' +
            data.items.map((it, i) =>
              '<div class="vb-row" data-selected="' + (i === 0) + '">' +
              '<span class="muted">' + it.icon + "</span>" +
              '<div><div class="name">' + it.name + "</div>" +
              '<div class="meta">' + it.user + (it.otp ? " · 动态口令" : "") + "</div></div>" +
              '<span class="vb-score mono">' + (i === 0 ? "↵" : (90 - i * 7)) + "</span></div>").join("") +
          "</div>" +
          '<div class="vb-status"><span>↑↓ 选择 · ↵ 打开 · ⌘C 复制</span><span class="mono">2ms</span></div></div>';

        const detail = '<div class="screen vb" data-active="' + (state.screen === "detail") + '">' +
          '<div class="vb-bar"><span class="muted">' + ICONS.back + "</span>" +
          '<input class="vb-input" value="github" readonly /><span class="vb-tag">登录</span></div>' +
          '<div class="vb-unlock" style="gap:14px">' +
          '<div><div class="tiny muted">用户名</div><div class="mono" style="font-size:13px">bossxie</div></div>' +
          '<div><div class="tiny muted">密码</div><div class="mono" style="font-size:13px">••••••••••••  <span class="tiny" style="color:#3757c8">⌘C</span></div></div>' +
          '<div><div class="tiny muted">动态口令</div>' +
          '<div class="mono" style="color:#3757c8;font-size:20px">742 913 <span class="tiny muted">18s</span></div></div>' +
          '<div><div class="tiny muted">备注</div><div class="tiny">主力开发账号 · 开了 2FA</div></div>' +
          "</div>" +
          '<div class="vb-status"><span>e 编辑 · ⌫ 删除 · esc 返回</span><span class="mono">AES</span></div></div>';

        const settings = '<div class="screen vb" data-active="' + (state.screen === "settings") + '">' +
          '<div class="vb-bar"><span class="vb-prompt">&gt;</span>' +
          '<input class="vb-input" value=":config" readonly /><span class="vb-tag">设置</span></div>' +
          '<div class="vb-list" style="padding-bottom:0">' +
            data.settings.map((s) =>
              '<div class="vb-row" style="grid-template-columns:16px 1fr auto">' +
              '<span class="vc-dot"></span>' +
              '<div><div class="name">' + s.k + "</div>" +
              (s.v ? '<div class="meta">' + s.v + "</div>" : '<div class="meta">已开启</div>') + "</div>" +
              '<span class="vb-score">' + (s.toggle ? "on" : "›") + "</span></div>").join("") +
            '<div class="vb-row" style="grid-template-columns:16px 1fr auto;color:#3757c8">' +
            '<span></span><div class="name">立即同步到现在</div><span class="vb-score mono">:sync</span></div>' +
            '<div class="vb-row" style="grid-template-columns:16px 1fr auto;color:#3757c8">' +
            '<span></span><div class="name">立即备份一份</div><span class="vb-score mono">:backup</span></div>' +
          "</div>" +
          '<div class="vb-status"><span>没有后台任务 · 所有联网由你触发</span><span class="mono">offline</span></div></div>';

        return unlock + vault + detail + settings;
      }

      /* ---------- Variant C ---------- */
      function renderC() {
        const unlock = '<div class="screen vc" data-active="' + (state.screen === "unlock") + '">' +
          '<div class="vc-unlock">' +
          '<div class="vc-hero"><div class="ring">' + ICONS.lock + "</div>" +
          "<h2>LocalPassword</h2><p>只属于这台电脑的保险库</p></div>" +
          '<div class="vc-group">' +
          '<div class="vc-row"><span class="k">安全密码</span><span class="v">••••••••</span></div>' +
          '<div class="vc-row"><span class="k">用 Touch ID 解锁</span><div class="vc-switch"></div></div>' +
          "</div>" +
          '<div style="padding:14px 12px"><button class="va-primary" style="width:100%">解锁</button></div>' +
          '<div style="padding:0 12px"><button class="va-ghost" style="width:100%">从备份恢复…</button></div>' +
          "</div></div>";

        const vault = '<div class="screen vc" data-active="' + (state.screen === "vault") + '">' +
          '<div class="vc-top"><h1>保险库</h1><div class="vc-search">搜索</div></div>' +
          '<div class="vc-scroll">' +
          '<div class="vc-group-title">今天用得多</div>' +
          '<div class="vc-group">' +
            data.items.slice(0, 2).map((it) =>
              '<div class="vc-row"><span>' + it.icon + '</span><span class="k">' + it.name + "</span>" +
              (it.otp ? '<span class="v mono">742 913</span>' : "") + '<span class="v">' + ICONS.chevron + "</span></div>").join("") +
          "</div>" +
          '<div class="vc-group-title">全部条目</div>' +
          '<div class="vc-group">' +
            data.items.slice(2).map((it) =>
              '<div class="vc-row"><span>' + it.icon + '</span><span class="k">' + it.name + "</span>" +
              '<span class="v">' + ICONS.chevron + "</span></div>").join("") +
          "</div></div>" +
          tabbar("vault") + "</div>";

        const detail = '<div class="screen vc" data-active="' + (state.screen === "detail") + '">' +
          '<div class="vc-top" style="border-bottom:0"><div class="tiny" style="color:#3757c8">‹ 保险库</div>' +
          '<h1 style="margin-top:6px">GitHub</h1><div class="tiny muted">github.com · 开发</div></div>' +
          '<div class="vc-scroll">' +
          '<div class="vc-group"><div class="vc-row"><span class="k">用户名</span><span class="v">bossxie</span></div>' +
          '<div class="vc-row"><span class="k">密码</span><span class="v mono">••••••••••••</span></div>' +
          '<div class="vc-row"><span class="k">动态口令</span><span class="v mono" style="color:#3757c8">742 913</span></div></div>' +
          '<div class="vc-group-title">操作</div>' +
          '<div class="vc-group"><div class="vc-row"><span class="k">显示二维码</span><span class="v">' + ICONS.chevron + "</span></div>" +
          '<div class="vc-row"><span class="k">复制密码</span><span class="v">' + ICONS.chevron + "</span></div></div>" +
          "</div></div>";

        const settings = '<div class="screen vc" data-active="' + (state.screen === "settings") + '">' +
          '<div class="vc-top"><h1>设置</h1></div>' +
          '<div class="vc-scroll">' +
          '<div class="vc-group-title">安全</div>' +
          '<div class="vc-group">' +
          '<div class="vc-row"><span class="k">安全密码</span><span class="v">3 天前修改</span><span class="v">' + ICONS.chevron + "</span></div>" +
          '<div class="vc-row"><span class="k">Touch ID 解锁</span><div class="vc-switch"></div></div>' +
          '<div class="vc-row"><span class="k">自动锁定</span><span class="v">15 分钟</span><span class="v">' + ICONS.chevron + "</span></div>" +
          "</div>" +
          '<div class="vc-group-title">备份（手动）</div>' +
          '<div class="vc-group">' +
          '<div class="vc-row"><span class="k">云备份地址</span><span class="v">r2</span><span class="v">' + ICONS.chevron + "</span></div>" +
          '<div class="vc-row"><span class="k">立即同步</span><span class="v">今天 14:02</span><span class="v">' + ICONS.chevron + "</span></div>" +
          '<div class="vc-row"><span class="k">立即备份</span><span class="v">3 份</span><span class="v">' + ICONS.chevron + "</span></div>" +
          "</div>" +
          '<div class="vc-group-title">关于</div>' +
          '<div class="vc-group"><div class="vc-row"><span class="k">版本</span><span class="v">2026.11.1</span></div>' +
          '<div class="vc-row"><span class="k">完全离线</span><div class="vc-dot"></div></div></div>' +
          "</div>" +
          tabbar("settings") + "</div>";

        return unlock + vault + detail + settings;
      }

      function tabbar(active) {
        const tabs = [
          { k: "vault", label: "保险库", ico: ICONS.vault },
          { k: "generator", label: "生成器", ico: ICONS.shield },
          { k: "backup", label: "备份", ico: ICONS.cloud },
          { k: "settings", label: "设置", ico: ICONS.gear },
        ];
        return '<div class="vc-tabbar">' +
          tabs.map((t) => '<div class="vc-tab" data-active="' + (t.k === active || (t.k === "backup" && active === "backup")) + '">' +
            t.ico + "<span>" + t.label + "</span></div>").join("") + "</div>";
      }

      function render() {
        const html = state.variant === "A" ? renderA() : state.variant === "B" ? renderB() : renderC();
        document.getElementById("screens").innerHTML = html;
        const meta = VARIANTS.find((v) => v.key === state.variant);
        document.getElementById("label").textContent = state.variant + " · " + meta.name;
        document.querySelectorAll("#screenTabs button").forEach((b) => {
          b.setAttribute("aria-selected", String(b.dataset.screen === state.screen));
        });
        const url = new URL(location.href);
        url.searchParams.set("variant", state.variant);
        history.replaceState(null, "", url);
      }

      function cycle(dir) {
        const i = VARIANTS.findIndex((v) => v.key === state.variant);
        state.variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key;
        render();
      }

      document.getElementById("prev").addEventListener("click", () => cycle(-1));
      document.getElementById("next").addEventListener("click", () => cycle(1));
      document.getElementById("screenTabs").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-screen]");
        if (!btn) return;
        state.screen = btn.dataset.screen;
        render();
      });
      window.addEventListener("keydown", (e) => {
        const el = document.activeElement;
        const typing = el && /^(INPUT|TEXTAREA)$/.test(el.tagName);
        if (typing) return;
        if (e.key === "ArrowLeft") cycle(-1);
        if (e.key === "ArrowRight") cycle(1);
        if (e.key === "1") { state.variant = "A"; render(); }
        if (e.key === "2") { state.variant = "B"; render(); }
        if (e.key === "3") { state.variant = "C"; render(); }
      });

      const params = new URLSearchParams(location.search);
      state.variant = (params.get("variant") || "A").toUpperCase();
      if (!VARIANTS.some((v) => v.key === state.variant)) state.variant = "A";
      render();
    </script>
  </body>
</html>
