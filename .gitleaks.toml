title = "LocalPass Gitleaks configuration"

[extend]
useDefault = true

# These files contain synthetic keys and tokens used only by unit tests.
# Keep exceptions limited to the exact fixture files below. These files must
# never contain real credentials, even though scanning is skipped for them.
[[allowlists]]
description = "Synthetic SSH and WebAuthn private keys in unit tests"
paths = [
  '''^apps/desktop/desktop_native/ssh_agent/src/storage/keydata\.rs$''',
  '''^apps/desktop/desktop_native/ssh_agent/src/storage/serialization\.rs$''',
  '''^apps/desktop/desktop_native/ssh_agent/tests/common\.rs$''',
  '''^apps/desktop/desktop_native/win_webauthn/src/api/plugin/crypto\.rs$''',
  '''^libs/importer/src/importers/onepassword/onepassword-1pux-importer\.spec\.ts$''',
  '''^libs/importer/src/importers/protonpass/protonpass-json-importer\.spec\.ts$''',
  '''^libs/importer/src/importers/spec-data/bitwarden-json/account-encrypted-v1\.json\.ts$''',
  '''^libs/importer/src/importers/spec-data/bitwarden-json/account-encrypted-v2\.json\.ts$''',
  '''^libs/importer/src/importers/spec-data/keeper-json/testdata\.json\.ts$''',
  '''^libs/importer/src/importers/spec-data/onepassword-1pux/ssh-key\.ts$''',
  '''^libs/importer/src/importers/spec-data/protonpass-json/protonpass\.json\.ts$''',
  '''^libs/importer/src/importers/psono/psono-json-importer\.spec\.ts$''',
  '''^libs/importer/src/importers/spec-data/psono-json/gpg\.ts$''',
]

[[allowlists]]
description = "Synthetic JWTs in unit tests"
paths = [
  '''^libs/common/src/auth/jwt/decode-jwt-token-to-json\.utility\.spec\.ts$''',
  '''^libs/common/src/auth/services/token\.service\.spec\.ts$''',
  '''^libs/legacy-crypto/src/models/enc-string\.spec\.ts$''',
]

[[allowlists]]
description = "Synthetic 1Password secret keys in importer tests"
paths = [
  '''^libs/importer/src/components/onepassword/onepassword-direct-import\.service\.spec\.ts$''',
  '''^libs/importer/src/importers/spec-data/onepassword-csv/multiple-items\.windows\.csv\.ts$''',
]

# Generic-key matches below are public identifiers, localization keys, encrypted
# test data, or variable names rather than usable credentials.
[[allowlists]]
description = "Known generic-key false positives in tests and public configuration"
paths = [
  '''^prototype/ui-redo-c/app\.js$''',
  '''^apps/browser/src/autofill/background/notification\.background\.spec\.ts$''',
  '''^apps/browser/src/manifest\.v3\.json$''',
  '''^apps/desktop/native-messaging-test-runner/src/variables\.ts$''',
  '''^apps/desktop/src/app/tools/send/send\.component\.ts$''',
  '''^apps/cli/src/tools/send/commands/receive\.command\.spec\.ts$''',
  '''^apps/web/config/(base|cloud|euprd)\.json$''',
  '''^apps/web/src/app-id\.json$''',
